[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genarch-pipeline"
version = "1.0.0"
# CI and local development both run 3.14, pinned in `.python-version` at the
# repo root and read from there by actions/setup-python (DECISIONS.md D12).
# The floor below is the oldest interpreter the package still imports on.
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "xlrd>=2.0",
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
genarch-validate = "pipeline.validate:validate"
genarch-update = "pipeline.update:run_update"
genarch-report = "pipeline.report:run_report"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]
